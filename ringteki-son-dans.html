<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090609">

<title>Ringteki Son Dans | kesmislalih</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
    --background: #090609;
    --surface: #110b10;
    --text: #f2edf0;
    --soft: #b8afb5;
    --muted: #756a72;
    --border: #30232d;
    --accent: #260015;
    --accent-light: #490020;
    --shadow: 0 20px 70px rgba(0,0,0,.7);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: var(--text);
    font-family: "Cormorant Garamond", serif;
    overflow-x: hidden;
}

/* ARKA PLAN */

.background-image {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        linear-gradient(
            180deg,
            rgba(5,3,5,.76),
            rgba(5,3,5,.94) 65%,
            #090609
        ),
        url("file_00000000375c81f4b311415188148be7.png")
        center 35% / cover no-repeat;
    filter: blur(2px);
    transform: scale(1.04);
}

.background-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
        radial-gradient(
            ellipse at center,
            transparent 0%,
            rgba(0,0,0,.35) 65%,
            rgba(0,0,0,.8) 100%
        );
}

/* KAPATMA */

.close-button {
    position: fixed;
    top: 25px;
    right: 30px;
    z-index: 20;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 39px;
    font-weight: 200;
    text-decoration: none;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: .3s;
}

.close-button:hover {
    color: #9b667f;
    transform: rotate(90deg);
}

/* ANA EKRAN */

.intro-page {
    width: 100%;
    min-height: 100vh;
    padding: 85px 20px 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
}

/* KAPAK */

.cover-container {
    width: min(310px, 76vw);
    position: relative;
    margin-bottom: 27px;
}

.cover-container::before {
    content: "";
    position: absolute;
    inset: -12px;
    z-index: -1;
    background: var(--accent);
    filter: blur(35px);
    opacity: .42;
}

.book-cover {
    display: block;
    width: 100%;
    height: auto;
    max-height: 490px;
    object-fit: contain;
    border-radius: 5px;
    border: 1px solid rgba(90,30,55,.45);
    box-shadow: var(--shadow);
}

/* KİTAP BİLGİSİ */

.book-information {
    width: min(650px, 100%);
}

.book-title {
    margin: 0;
    font-family: Arial, sans-serif;
    font-size: clamp(30px, 7vw, 48px);
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1.2;
}

.book-author {
    margin-top: 12px;
    color: #6e1237;
    font-family: Arial, sans-serif;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
}

/* ALINTI */

.book-quote {
    max-width: 690px;
    margin: 32px auto 34px;
    color: #f0e9ed;
    font-family: Arial, sans-serif;
    font-size: clamp(19px, 4.5vw, 28px);
    font-style: italic;
    font-weight: 400;
    line-height: 1.7;
}

/* DEVAM ET */

.continue-button {
    width: min(310px, 85%);
    min-height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    border: 1px solid #390018;
    background: rgba(10,4,8,.5);
    color: #f3edf0;
    font-family: Arial, sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    text-decoration: none;
    transition: .3s;
}

.continue-button:hover {
    background: #260015;
    border-color: #4c092b;
    box-shadow: 0 0 25px rgba(65,0,30,.35);
}

/* TANITIM */

.description-toggle {
    margin-top: 22px;
    padding: 8px 12px;
    border: 0;
    background: transparent;
    color: #68102f;
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 2px;
    cursor: pointer;
}

.description-toggle span {
    display: inline-block;
    margin-left: 5px;
    transition: transform .3s;
}

.description-toggle.active span {
    transform: rotate(180deg);
}

.description-content {
    width: min(620px, 94%);
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    margin: 0 auto;
    color: var(--soft);
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: 1.9;
    transition: max-height .5s ease, opacity .4s, margin .4s;
}

.description-content.open {
    max-height: 350px;
    opacity: 1;
    margin-top: 18px;
    margin-bottom: 10px;
}

/* ALT YÖNLENDİRME */

.other-books {
    margin-top: 100px;
    padding: 20px;
    color: #958b92;
    font-family: Arial, sans-serif;
    font-size: 15px;
    letter-spacing: 4px;
    text-decoration: none;
    transition: .3s;
}

.other-books:hover {
    color: #7b2346;
}

/* FOOTER */

.intro-footer {
    margin-top: auto;
    padding-top: 35px;
    color: #665b63;
    font-size: 14px;
    letter-spacing: 2px;
}

/* MOBİL */

@media (max-width: 600px) {

    .intro-page {
        padding: 90px 18px 25px;
    }

    .close-button {
        top: 18px;
        right: 18px;
        font-size: 35px;
    }

    .cover-container {
        width: min(285px, 78vw);
        margin-bottom: 28px;
    }

    .book-title {
        font-size: 34px;
        letter-spacing: 1px;
    }

    .book-author {
        font-size: 17px;
        letter-spacing: 4px;
    }

    .book-quote {
        margin-top: 29px;
        margin-bottom: 31px;
        font-size: 21px;
        line-height: 1.6;
    }

    .continue-button {
        min-height: 60px;
        font-size: 19px;
    }

    .description-toggle {
        font-size: 13px;
        letter-spacing: 1.5px;
    }

    .other-books {
        margin-top: 90px;
        font-size: 13px;
        letter-spacing: 3px;
    }
}

/* MASAÜSTÜ */

@media (min-width: 900px) {
    .intro-page {
        padding-top: 55px;
    }

    .cover-container {
        width: 305px;
    }
}
</style>
</head>

<body>

<div class="background-image"></div>
<div class="background-overlay"></div>

<a href="index.html" class="close-button" aria-label="Kapat">×</a>

<main class="intro-page">

    <div class="cover-container">
        <img
            class="book-cover"
            src="file_00000000375c81f4b311415188148be7.png"
            alt="Ringteki Son Dans kitap kapağı"
        >
    </div>

    <section class="book-information">

        <h1 class="book-title">Ringteki Son Dans</h1>

        <div class="book-author">KESMİSLALİH</div>

        <blockquote class="book-quote">
            “Bir karanlık, iki kurşun.
            Binbir acı, iki yetim.”
        </blockquote>

        <a href="bolum-1.html" class="continue-button">
            DEVAM ET
        </a>

        <button
            type="button"
            class="description-toggle"
            id="descriptionToggle"
            aria-expanded="false"
        >
            TANITIMIN TAMAMINI OKU
            <span>⌄</span>
        </button>

        <div class="description-content" id="descriptionContent">
            <p>
                Küçükken gözlerini kapayınca oyuncaklarının
                uyanacağını sananlara...
            </p>
        </div>

    </section>

    <a href="index.html" class="other-books">
        ← DİĞER KİTAPLAR İÇİN KAYDIR →
    </a>

    <footer class="intro-footer">
        kesmislalih · 2026
    </footer>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   TANITIMI AÇ / KAPAT
========================= */

const descriptionToggle =
    document.getElementById("descriptionToggle");

const descriptionContent =
    document.getElementById("descriptionContent");

descriptionToggle.addEventListener("click", function () {

    const isOpen =
        descriptionContent.classList.toggle("open");

    descriptionToggle.classList.toggle("active", isOpen);

    descriptionToggle.setAttribute(
        "aria-expanded",
        String(isOpen)
    );

    descriptionToggle.innerHTML = isOpen
        ? 'TANITIMI KAPAT <span>⌄</span>'
        : 'TANITIMIN TAMAMINI OKU <span>⌄</span>';

});


/* =========================
   SUPABASE BAĞLANTISI
========================= */

const SUPABASE_URL =
    "https://edgpwcoypywwodgfkkbi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_9eEl_WjKST_TLNRrzN7jmA_5npT6GPc";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const BOOK_NAME = "Ringteki Son Dans";


/* =========================
   KİTAP GÖRÜNTÜLENMESİ
========================= */

async function increaseBookView() {

    const { error } = await supabaseClient.rpc(
        "arttir_goruntulenme",
        {
            p_kitap: BOOK_NAME,
            p_bolum: 0
        }
    );

    if (error) {
        console.error(
            "Kitap görüntülenmesi kaydedilemedi:",
            error
        );
    }

}


/* =========================
   SAYFA BAŞLAT
========================= */

document.addEventListener("DOMContentLoaded", function () {
    increaseBookView();
});

</script>

</body>
</html>
