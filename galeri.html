<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Galeri | kesmislalih</title>


<style>


@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap');


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {

    background: #09090b;

    color: #f3efe8;

    font-family:
        "Cormorant Garamond",
        serif;

    min-height: 100vh;

}



/* =========================
   ÜST KISIM
========================= */

.gallery-header {

    width: 100%;

    padding: 25px 6%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom:
        1px solid #28242c;

}


.gallery-logo {

    color: #f8f3ff;

    text-decoration: none;

    font-family:
        "Great Vibes",
        cursive;

    font-size: 32px;

}


.back-button {

    color: #aaa39a;

    text-decoration: none;

    font-family:
        Arial,
        sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    transition: .3s;

}


.back-button:hover {

    color: #cdb9eb;

}



/* =========================
   BAŞLIK
========================= */

.gallery-intro {

    text-align: center;

    padding:
        105px 25px 70px;

}


.gallery-label {

    font-family:
        Arial,
        sans-serif;

    font-size: 8px;

    letter-spacing: 5px;

    color: #756d79;

    margin-bottom: 20px;

}


.gallery-intro h1 {

    font-size:
        clamp(55px, 9vw, 90px);

    font-weight: 400;

    line-height: 1;

}


.gallery-subtitle {

    margin-top: 18px;

    font-family:
        "Great Vibes",
        cursive;

    font-size: 30px;

    color: #cdb9eb;

}



/* =========================
   GALERİ
========================= */

.gallery {

    width:
        min(1100px, 88%);

    margin:
        0 auto 120px;

}


.gallery-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;

}


.gallery-item {

    position: relative;

    aspect-ratio: 4 / 5;

    overflow: hidden;

    border:
        1px solid #29252d;

    background: #111015;

    cursor: pointer;

}


.gallery-item img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    transition:
        transform .6s ease,
        opacity .4s ease;

}


.gallery-item:hover img {

    transform: scale(1.05);

    opacity: .82;

}


/* =========================
   FOTOĞRAF NUMARASI
========================= */

.gallery-number {

    position: absolute;

    left: 15px;

    bottom: 12px;

    z-index: 2;

    font-family:
        Arial,
        sans-serif;

    font-size: 7px;

    letter-spacing: 2px;

    color: #f3efe8;

    opacity: .75;

}



/* =========================
   BÜYÜTME PENCERESİ
========================= */

.lightbox {

    position: fixed;

    inset: 0;

    background:
        rgba(5, 5, 7, .94);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px;

    opacity: 0;

    visibility: hidden;

    transition: .3s;

    z-index: 999;

}


.lightbox.open {

    opacity: 1;

    visibility: visible;

}


.lightbox img {

    max-width: 90vw;

    max-height: 88vh;

    object-fit: contain;

    border:
        1px solid #39323f;

    box-shadow:
        0 20px 70px rgba(0,0,0,.6);

}


.lightbox-close {

    position: absolute;

    top: 25px;

    right: 35px;

    background: none;

    border: none;

    color: #eee8e1;

    font-size: 30px;

    font-weight: 200;

    cursor: pointer;

}



/* =========================
   FOOTER
========================= */

.gallery-footer {

    padding:
        55px 25px;

    border-top:
        1px solid #252328;

    text-align: center;

}


.gallery-footer-logo {

    font-family:
        "Great Vibes",
        cursive;

    font-size: 35px;

    color: #f8f3ff;

}


.gallery-footer p {

    margin-top: 12px;

    color: #77716a;

    font-family:
        Arial,
        sans-serif;

    font-size: 7px;

    letter-spacing: 2px;

}



/* =========================
   TELEFON
========================= */

@media (max-width: 700px) {


    .gallery-header {

        padding:
            20px 5%;

    }


    .gallery-logo {

        font-size: 27px;

    }


    .gallery-intro {

        padding:
            80px 20px 50px;

    }


    .gallery-subtitle {

        font-size: 25px;

    }


    .gallery {

        width: 92%;

    }


    .gallery-grid {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;

    }


    .lightbox {

        padding: 15px;

    }


    .lightbox img {

        max-width: 95vw;

        max-height: 82vh;

    }


    .lightbox-close {

        top: 15px;

        right: 20px;

    }

}

</style>

</head>


<body>



<!-- =========================
     HEADER
========================= -->

<header class="gallery-header">


    <a
        href="index.html"
        class="gallery-logo">

        kesmislalih

    </a>


    <a
        href="index.html"
        class="back-button">

        ← ANA SAYFA

    </a>


</header>



<!-- =========================
     BAŞLIK
========================= -->

<section class="gallery-intro">


    <div class="gallery-label">
        KESMISLALIH
    </div>


    <h1>
        Galeri
    </h1>


    <p class="gallery-subtitle">
        hikâyelerden kareler
    </p>


</section>



<!-- =========================
     FOTOĞRAFLAR
========================= -->

<main class="gallery">


    <div class="gallery-grid">



        <!-- FOTOĞRAF 1 -->

        <div
            class="gallery-item"
            onclick="openLightbox(this)">

            <img
                src="772b5be803dcc10b56a2cae0088acf3e.jpg"
                alt="Galeri fotoğrafı 1">

            <span class="gallery-number">
                01
            </span>

        </div>



        <!-- FOTOĞRAF 2 -->

        <div
            class="gallery-item"
            onclick="openLightbox(this)">

            <img
                src="ad301506aa5527e2b6d349fcbf02e9a8 (1).jpg"
                alt="Galeri fotoğrafı 2">

            <span class="gallery-number">
                02
            </span>

        </div>



        <!-- FOTOĞRAF 3 -->

        <div
            class="gallery-item"
            onclick="openLightbox(this)">

            <img
                src="0f8b7991dde0f22ff23fb81e0fc16649.jpg"
                alt="Galeri fotoğrafı 3">

            <span class="gallery-number">
                03
            </span>

        </div>



        <!-- FOTOĞRAF 4 -->

        <div
            class="gallery-item"
            onclick="openLightbox(this)">

            <img
                src="bd00784591329cdde6e7804525bb3951.jpg"
                alt="Galeri fotoğrafı 4">

            <span class="gallery-number">
                04
            </span>

        </div>



        <!-- FOTOĞRAF 5 -->

        <div
            class="gallery-item"
            onclick="openLightbox(this)">

            <img
                src="9be113dce8dd12d87ae4f2bf8cf5293e (1).jpg"
                alt="Galeri fotoğrafı 5">

            <span class="gallery-number">
                05
            </span>

        </div>



        <!-- FOTOĞRAF 6 -->

        <div
            class="gallery-item"
            onclick="openLightbox(this)">

            <img
                src="6b0bac9092b0bc230917f062c52e84ad.jpg"
                alt="Galeri fotoğrafı 6">

            <span class="gallery-number">
                06
            </span>

        </div>


    </div>

</main>



<!-- =========================
     FOTOĞRAF BÜYÜTME
========================= -->

<div
    class="lightbox"
    id="lightbox"
    onclick="closeLightbox()">


    <button
        class="lightbox-close"
        onclick="closeLightbox()">

        ×

    </button>


    <img
        id="lightboxImage"
        src=""
        alt="Büyük galeri görseli"
        onclick="event.stopPropagation()">


</div>



<!-- =========================
     FOOTER
========================= -->

<footer class="gallery-footer">


    <div class="gallery-footer-logo">
        kesmislalih
    </div>


    <p>
        © 2026 kesmislalih
    </p>


</footer>



<script>


function openLightbox(item) {

    const image =
        item.querySelector("img");

    const lightbox =
        document.getElementById("lightbox");

    const lightboxImage =
        document.getElementById("lightboxImage");


    lightboxImage.src =
        image.src;


    lightbox.classList.add("open");

    document.body.style.overflow =
        "hidden";

}



function closeLightbox() {

    const lightbox =
        document.getElementById("lightbox");


    lightbox.classList.remove("open");

    document.body.style.overflow =
        "";

}



document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeLightbox();

        }

    }
);

</script>


</body>

</html>
