*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#09090b;
    color:#f3efe8;
    font-family:"Cormorant Garamond",serif;

/* =========================
   HEADER
========================= */

header{
    width:100%;
    padding:25px 6%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:absolute;
    top:0;
    left:0;

    z-index:100;
}


/* DAHA YUMUŞAK LOGO */

.logo{
    color:#eee8f2;
    text-decoration:none;

    font-family:"Great Vibes",cursive;
    font-size:31px;

    font-weight:400;

    opacity:.92;

    text-shadow:
        0 0 5px rgba(220,195,255,.25),
        0 0 15px rgba(185,167,216,.12);

    transition:.3s;
}

.logo:hover{
    color:#f8f3ff;
    opacity:1;
}


/* =========================
   MENÜ BUTONU
========================= */

.menu-button{
    width:40px;
    height:40px;

    border:1px solid #38323f;
    background:rgba(9,9,11,.75);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:5px;

    cursor:pointer;
    z-index:102;
}

.menu-line{
    width:18px;
    height:1px;

    background:#eee8e1;

    transition:.3s;
}

.menu-button.active .menu-line:nth-child(1){
    transform:translateY(6px) rotate(45deg);
}

.menu-button.active .menu-line:nth-child(2){
    opacity:0;
}

.menu-button.active .menu-line:nth-child(3){
    transform:translateY(-6px) rotate(-45deg);
}


/* =========================
   MENÜ PANELİ
========================= */

.menu-panel{
    position:fixed;

    top:0;
    right:-330px;

    width:310px;
    height:100vh;

    background:#111015;

    border-left:1px solid #302a38;

    padding:110px 40px 40px;

    z-index:101;

    transition:right .45s ease;

    overflow-y:auto;
}

.menu-panel.open{
    right:0;
}

.menu-small-title{
    font-family:Arial,sans-serif;

    font-size:8px;
    letter-spacing:4px;

    color:#756d79;

    margin-bottom:25px;
}

.menu-panel a.menu-link{
    display:block;

    padding:16px 0;

    border-bottom:1px solid #29252d;

    color:#e8e2da;

    text-decoration:none;

    font-size:22px;

    transition:.3s;
}

.menu-panel a.menu-link:hover{
    color:#cdb9eb;
    padding-left:8px;
}


/* =========================
   SOSYAL İKONLAR
========================= */

.menu-social-title{
    font-family:Arial,sans-serif;

    font-size:7px;
    letter-spacing:3px;

    color:#756d79;

    margin-top:27px;
    margin-bottom:13px;
}

.menu-social{
    display:flex;
    align-items:center;

    gap:8px;
    flex-wrap:wrap;
}

.menu-social a{
    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#8b8195;

    text-decoration:none;

    border:1px solid #332e38;

    transition:.3s ease;
}

.menu-social a:hover{
    color:#d8c8f0;
    border-color:#756586;

    transform:translateY(-3px);

    background:#17141b;
}

.icon{
    width:18px;
    height:18px;

    fill:currentColor;
}

.x-icon{
    width:15px;
    height:15px;
}


/* =========================
   MENÜ ALT LOGO
========================= */

.menu-footer{
    margin-top:45px;

    padding-top:20px;

    border-top:1px solid #29252d;

    font-family:"Great Vibes",cursive;

    font-size:26px;

    color:#8f819e;
}


/* =========================
   MENÜ ARKA PLAN
========================= */

.menu-overlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(2px);

    opacity:0;
    visibility:hidden;

    transition:.3s;

    z-index:100;
}

.menu-overlay.open{
    opacity:1;
    visibility:visible;
}


/* =========================
   ANA SAYFA
========================= */

.hero{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:100px 25px 80px;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 43%,
            rgba(116,88,145,.22) 0%,
            rgba(83,63,105,.15) 23%,
            rgba(28,24,33,.45) 48%,
            #09090b 82%
        );
}

.hero::before{
    content:"";

    position:absolute;

    width:650px;
    height:650px;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(191,162,226,.23) 0%,
            rgba(124,94,157,.13) 32%,
            transparent 72%
        );

    filter:blur(65px);

    border-radius:50%;

    pointer-events:none;
}

.hero::after{
    content:"";

    position:absolute;
    inset:0;

    opacity:.045;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.45'/%3E%3C/svg%3E");

    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
}

}

.line{

.button{

.button:hover{

<script>

/* =========================
   MENÜ
========================= */

const menuButton =
    document.getElementById("menuButton");

const menuPanel =
    document.getElementById("menuPanel");

const menuOverlay =
    document.getElementById("menuOverlay");

const menuLinks =
    document.querySelectorAll(".menu-panel a.menu-link");


function closeMenu(){

    menuButton.classList.remove("active");

    menuPanel.classList.remove("open");

    menuOverlay.classList.remove("open");

}


menuButton.addEventListener("click",function(){

    menuButton.classList.toggle("active");

    menuPanel.classList.toggle("open");

    menuOverlay.classList.toggle("open");

});


menuOverlay.addEventListener("click",closeMenu);


menuLinks.forEach(function(link){

    link.addEventListener("click",closeMenu);

});


document.addEventListener("keydown",function(event){

    if(event.key==="Escape"){
        closeMenu();
    }

});



/* =========================
   DUVAR YORUMLARI
========================= */

const wallForm =
    document.getElementById("wallForm");

const wallComments =
    document.getElementById("wallComments");

const commentName =
    document.getElementById("commentName");

const commentText =
    document.getElementById("commentText");


wallForm.addEventListener("submit",function(event){

    event.preventDefault();


    const name =
        commentName.value.trim();

    const text =
        commentText.value.trim();


    if(!name || !text){
        return;
    }


    const card =
        document.createElement("div");

    card.className="comment-card";


    const nameElement =
        document.createElement("div");

    nameElement.className="comment-name";

    nameElement.textContent=name;


    const textElement =
        document.createElement("div");

    textElement.className="comment-text";

    textElement.textContent=text;


    card.appendChild(nameElement);

    card.appendChild(textElement);


    wallComments.prepend(card);


    commentName.value="";

    commentText.value="";

});


</script>
