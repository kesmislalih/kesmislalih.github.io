<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>kesmislalih</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #09090b;
    color: #f4f0ea;
    font-family: "Cormorant Garamond", serif;
}

/* ÜST MENÜ */

header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 25px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

.logo {
    font-family: "Great Vibes", cursive;
    font-size: 32px;
    color: #f4f0ea;
}

nav {
    display: flex;
    gap: 25px;
}

nav a {
    color: #d8d2ca;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    transition: 0.3s;
}

nav a:hover {
    color: #b9a7d8;
}

/* ANA ALAN */

.hero {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 100px 25px 50px;
    position: relative;
    overflow: hidden;
}

/* arkadaki hafif ışık */

.hero::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    background: #5d4d73;
    opacity: 0.10;
    filter: blur(130px);
    border-radius: 50%;
}

.hero-content {
    position: relative;
    z-index: 2;
}

.hero h1 {
    font-family: "Great Vibes", cursive;
    font-size: clamp(70px, 18vw, 150px);
    font-weight: 400;
    line-height: 1;
    color: #f4f0ea;
}

.line {
    width: 65px;
    height: 1px;
    background: #b9a7d8;
    margin: 30px auto;
}

.hero p {
    max-width: 500px;
    margin: auto;
    color: #aaa39a;
    font-family: Arial, sans-serif;
    font-size: 11px;
    line-height: 1.8;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.button {
    display: inline-block;
    margin-top: 45px;
    padding: 14px 25px;
    border: 1px solid #6e6384;
    color: #f4f0ea;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    transition: 0.3s;
}

.button:hover {
    background: #b9a7d8;
    color: #09090b;
}

/* MOBİL */

@media (max-width: 700px) {

    header {
        padding: 20px 5%;
        align-items: flex-start;
    }

    .logo {
        font-size: 28px;
    }

    nav {
        gap: 9px;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: 230px;
    }

    nav a {
        font-size: 8px;
        letter-spacing: 1px;
    }

    .hero h1 {
        font-size: 82px;
    }

    .hero p {
        font-size: 9px;
        letter-spacing: 2px;
        max-width: 330px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">kesmislalih</div>

    <nav>
        <a href="#">ANA SAYFA</a>
        <a href="#">KİTAPLAR</a>
        <a href="#">HAKKIMDA</a>
        <a href="#">DUYURULAR</a>
        <a href="#">İLETİŞİM</a>
    </nav>

</header>


<section class="hero">

    <div class="hero-content">

        <h1>kesmislalih</h1>

        <div class="line"></div>

        <p>
            bazı hikâyeler anlatılmak için değil,
            hissedilmek için yazılır.
        </p>

        <a href="#" class="button">
            KİTAPLARIMI KEŞFET
        </a>

    </div>

</section>

</body>
</html>
