
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b080a">
<title>kesmislalih</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b080a;
  --text: #f8edf1;
  --muted: #c8b7bf;
  --accent: #a12d4d;
  --line: rgba(218, 177, 191, .2);
  --panel: rgba(19, 10, 14, .98);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  background: var(--bg);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Cormorant Garamond", serif;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

body.light {
  --bg: #f4edf0;
  --text: #29171f;
  --muted: #765e68;
  --accent: #922744;
  --line: rgba(80, 31, 49, .18);
  --panel: rgba(248, 240, 243, .98);
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
}

.no-scroll {
  overflow: hidden;
}

/* AÇILIŞ VİDEOSU */

#intro-screen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #080608;
  opacity: 1;
  visibility: visible;
  transition: opacity .7s ease, visibility .7s ease;
}

#intro-screen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#intro-video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #080608;
}

#skip-intro {
  position: absolute;
  right: 20px;
  bottom: 20px;
  padding: 9px 18px;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 30px;
  background: rgba(10,5,8,.7);
  color: white;
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
}

/* ÜST MENÜ */

.topbar {
  position: absolute;
  z-index: 30;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 76px;
  padding: 16px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: linear-gradient(
    to bottom,
    rgba(8,5,7,.85),
    rgba(8,5,7,.25),
    transparent
  );
}

.brand-small {
  font-family: "Great Vibes", cursive;
  font-size: 35px;
  color: #f7e6eb;
  white-space: nowrap;
  text-shadow: 0 2px 12px #000;
}

.main-nav {
  display: flex;
  align-items: center;
  gap: clamp(12px, 2.5vw, 30px);
}

.main-nav a {
  position: relative;
  color: #fff3f6;
  font-size: 16px;
  letter-spacing: 1px;
  white-space: nowrap;
  text-shadow: 0 2px 8px #000;
}

.main-nav a::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 0;
  width: 0;
  height: 1px;
  background: #d99aaf;
  transition: width .25s;
}

.main-nav a:hover::after {
  width: 100%;
}

#menu-button {
  width: 41px;
  height: 41px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 50%;
  background: rgba(10,5,8,.5);
  cursor: pointer;
}

#menu-button span {
  width: 15px;
  height: 1px;
  background: #fff;
}

/* VİDEOLU ANA SAHNE */

.hero {
  position: relative;
  isolation: isolate;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #090609;
}

.hero-video-wrap {
  position: absolute;
  inset: 0;
  z-index: -3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #090609;
}

#hero-video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  background: #090609;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(
      to bottom,
      rgba(7,4,6,.42) 0%,
      rgba(7,4,6,.12) 35%,
      rgba(7,4,6,.35) 62%,
      rgba(7,4,6,.88) 100%
    ),
    radial-gradient(
      ellipse at center,
      rgba(8,4,7,.02) 0%,
      rgba(8,4,7,.25) 100%
    );
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 2;
  width: min(92%, 760px);
  margin: 0 auto;
  padding: 110px 0 65px;
  text-align: center;
  animation: fadeIn 1.3s ease both;
}

.signature {
  font-family: "Great Vibes", cursive;
  font-weight: 400;
  font-size: clamp(70px, 12vw, 126px);
  line-height: 1.2;
  color: #fff8fa;
  text-shadow:
    0 2px 5px rgba(0,0,0,.95),
    0 4px 20px rgba(0,0,0,.95),
    0 0 35px rgba(125,25,56,.4);
}

.signature-sub {
  margin-top: 4px;
  font-size: clamp(16px, 2.5vw, 24px);
  font-weight: 500;
  letter-spacing: clamp(3px, .9vw, 7px);
  color: #fff0f4;
  text-shadow: 0 2px 9px #000, 0 0 20px #000;
}

.tagline {
  max-width: 550px;
  margin: 23px auto 0;
  font-size: clamp(16px, 2.3vw, 21px);
  font-style: italic;
  letter-spacing: 1px;
  line-height: 1.6;
  color: #fff5f7;
  text-shadow: 0 2px 7px #000, 0 0 18px #000;
}

/* YUVARLAK PLATFORM AMBLEMLERİ */

.social-links {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 26px;
}

.social-icon {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,226,235,.72);
  border-radius: 50%;
  color: #fff7f9;
  background: rgba(12,6,9,.72);
  box-shadow: 0 3px 16px rgba(0,0,0,.28);
  backdrop-filter: blur(7px);
  transition: transform .25s, background .25s, border-color .25s;
}

.social-icon:hover {
  transform: translateY(-4px);
  background: #85203e;
  border-color: #f0b7c9;
}

.social-icon svg {
  display: block;
  width: 19px;
  height: 19px;
}

.social-icon .letter {
  font-family: Arial, sans-serif;
  font-size: 19px;
  font-weight: 600;
}

.scroll-hint {
  position: absolute;
  bottom: 17px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,240,245,.7);
  font-size: 10px;
  letter-spacing: 4px;
  white-space: nowrap;
}

.home-empty {
  min-height: 20vh;
  background: linear-gradient(to bottom, #10090c, var(--bg));
}

footer {
  padding: 22px 15px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 1px;
  border-top: 1px solid var(--line);
}

/* YAN MENÜ */

#drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(0,0,0,.65);
  opacity: 0;
  visibility: hidden;
  transition: .3s;
}

#drawer-backdrop.open {
  opacity: 1;
  visibility: visible;
}

#drawer {
  position: fixed;
  z-index: 100;
  top: 0;
  right: 0;
  width: min(330px, 86vw);
  height: 100vh;
  height: 100dvh;
  padding: 26px;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-left: 1px solid var(--line);
  transform: translateX(105%);
  transition: transform .35s ease;
}

#drawer.open {
  transform: translateX(0);
}

.drawer-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 36px;
}

.drawer-logo {
  font-family: "Great Vibes", cursive;
  font-size: 36px;
  color: var(--accent);
}

#close-drawer {
  width: 38px;
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--text);
  background: transparent;
  font-size: 24px;
  cursor: pointer;
}

.drawer-links {
  display: flex;
  flex-direction: column;
}

.drawer-links a {
  padding: 16px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 19px;
  letter-spacing: 1px;
}

.drawer-links a:hover {
  color: var(--accent);
}

.theme-controls {
  margin-top: auto;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}

.theme-label {
  margin-bottom: 13px;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 2px;
}

.theme-buttons {
  display: flex;
  gap: 10px;
}

.theme-buttons button {
  flex: 1;
  padding: 11px 8px;
  border: 1px solid var(--line);
  border-radius: 25px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
}

.theme-buttons button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* TELEFON UYUMLULUĞU */

@media (max-width: 680px) {
  .topbar {
    min-height: 65px;
    padding: 12px 4%;
    gap: 10px;
  }

  .brand-small {
    font-size: 29px;
  }

  .main-nav {
    gap: 10px;
  }

  .main-nav a {
    font-size: 12px;
    letter-spacing: 0;
  }

  .main-nav a:nth-child(3) {
    display: none;
  }

  #menu-button {
    width: 36px;
    height: 36px;
  }

  .hero-content {
    width: 94%;
    padding-top: 90px;
    padding-bottom: 55px;
  }

  .signature {
    font-size: clamp(62px, 15vw, 94px);
  }

  .signature-sub {
    font-size: clamp(14px, 3.5vw, 19px);
    letter-spacing: 3px;
  }

  .tagline {
    max-width: 340px;
    margin-top: 19px;
    font-size: 16px;
  }

  .social-links {
    gap: 10px;
    margin-top: 23px;
  }

  .social-icon {
    width: 38px;
    height: 38px;
  }

  .social-icon svg {
    width: 17px;
    height: 17px;
  }

  .scroll-hint {
    bottom: 13px;
    font-size: 9px;
    letter-spacing: 3px;
  }
}

@media (max-width: 390px) {
  .brand-small {
    font-size: 26px;
  }

  .main-nav {
    gap: 8px;
  }

  .main-nav a {
    font-size: 11px;
  }

  .social-links {
    gap: 8px;
  }

  .social-icon {
    width: 35px;
    height: 35px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<script>
  
/* AÇILIŞ VİDEOSU */

const introScreen = document.getElementById("intro-screen");
const introVideo = document.getElementById("intro-video");
const skipIntro = document.getElementById("skip-intro");

function closeIntro() {
  if (!introScreen || introScreen.classList.contains("hidden")) return;

  introScreen.classList.add("hidden");
  document.body.classList.remove("no-scroll");

  if (introVideo) introVideo.pause();
}

document.body.classList.add("no-scroll");

skipIntro.addEventListener("click", closeIntro);
introVideo.addEventListener("ended", closeIntro);
introVideo.addEventListener("error", closeIntro);

introVideo.play().catch(() => {
  /* Otomatik oynatma engellenirse GEÇ düğmesi kullanılabilir. */
});


/* ANA SAYFA VİDEOSU */

const heroVideo = document.getElementById("hero-video");

if (heroVideo) {
  heroVideo.play().catch(() => {});
}


/* YAN MENÜ */

const menuButton = document.getElementById("menu-button");
const closeDrawerButton = document.getElementById("close-drawer");
const drawer = document.getElementById("drawer");
const drawerBackdrop = document.getElementById("drawer-backdrop");

function openDrawer() {
  drawer.classList.add("open");
  drawerBackdrop.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  menuButton.setAttribute("aria-expanded", "true");
  document.body.classList.add("no-scroll");
}

function closeDrawer() {
  drawer.classList.remove("open");
  drawerBackdrop.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
  menuButton.setAttribute("aria-expanded", "false");

  if (introScreen.classList.contains("hidden")) {
    document.body.classList.remove("no-scroll");
  }
}

menuButton.addEventListener("click", openDrawer);
closeDrawerButton.addEventListener("click", closeDrawer);
drawerBackdrop.addEventListener("click", closeDrawer);

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    closeDrawer();
    closeIntro();
  }
});


/* AYDINLIK / KARANLIK TEMA */

const lightThemeButton = document.getElementById("light-theme");
const darkThemeButton = document.getElementById("dark-theme");

function applyTheme(theme) {
  const isLight = theme === "light";

  document.body.classList.toggle("light", isLight);
  lightThemeButton.classList.toggle("active", isLight);
  darkThemeButton.classList.toggle("active", !isLight);

  document.documentElement.style.colorScheme =
    isLight ? "light" : "dark";

  try {
    localStorage.setItem("siteTheme", theme);
  } catch (error) {}
}

let savedTheme = "dark";

try {
  savedTheme = localStorage.getItem("siteTheme") || "dark";
} catch (error) {}

applyTheme(savedTheme);

lightThemeButton.addEventListener("click", () => {
  applyTheme("light");
});

darkThemeButton.addEventListener("click", () => {
  applyTheme("dark");
});


/* TARİH */

document.getElementById("copyright-year").textContent =
  new Date().getFullYear();
