
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>kesmislalih</title>
  <meta name="description" content="kesmislalih'in kitapları, karakterleri ve hikâyeleri.">
  <meta name="theme-color" content="#0b090a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- Favicon simgemizi daha sonra ekleyeceğiz -->

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b090a;
      --surface: #151012;
      --text: #eee6e8;
      --muted: #b9a6ac;
      --accent: #a77b88;
      --silver: #d4cbd0;
      --border: #38252c;
    }

    body.light {
      color-scheme: light;
      --bg: #f5f1f0;
      --surface: #fffaf9;
      --text: #281c20;
      --muted: #79676d;
      --accent: #875363;
      --silver: #74515d;
      --border: #e1d1d6;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      transition: background .3s, color .3s;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    /* AÇILIŞ VİDEOSU */

    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #080708;
      opacity: 1;
      visibility: visible;
      transition: opacity .6s ease, visibility .6s ease;
    }

    #intro-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #intro-video {
      display: block;
      width: min(100%, 1000px);
      max-height: 82vh;
      object-fit: contain;
      background: #080708;
    }

    #skip-intro {
      position: absolute;
      right: 25px;
      bottom: 25px;
      padding: 12px 20px;
      color: #e8dfe3;
      background: #211319;
      border: 1px solid #79505e;
      font-size: 16px;
      cursor: pointer;
    }

    #skip-intro:hover {
      background: #3a202a;
    }

    /* ÜST MENÜ */

    .topbar {
      min-height: 58px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border-bottom: 1px solid var(--border);
    }

    .menu-button {
      width: 40px;
      height: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .menu-button span {
      width: 25px;
      height: 1px;
      background: var(--silver);
      transition: width .2s;
    }

    .menu-button span:nth-child(2) {
      width: 18px;
    }

    .menu-button:hover span:nth-child(2) {
      width: 25px;
    }

    /* LOGO VE SLOGAN */

    .brand {
      min-height: 300px;
      padding: 45px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo {
      margin: 0;
      color: var(--silver);
      font-family: "Great Vibes", cursive;
      font-size: clamp(65px, 12vw, 112px);
      font-weight: 400;
      line-height: 1.25;
    }

    .brand-name {
      margin: 8px 0 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 500;
      letter-spacing: 1px;
    }

    .tagline {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 2.5vw, 19px);
      font-style: italic;
      letter-spacing: .5px;
    }

    /* YATAY MENÜ */

    .main-nav {
      padding: 0 12px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .main-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(22px, 4vw, 55px);
      width: max-content;
      min-width: 100%;
      padding: 19px 10px;
    }

    .main-nav a {
      position: relative;
      white-space: nowrap;
      font-size: 17px;
      transition: color .2s;
    }

    .main-nav a:hover {
      color: var(--accent);
    }

    .main-nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width .25s;
    }

    .main-nav a:hover::after {
      width: 100%;
    }

    /* ANA SAYFA ALANI */

    .home-space {
      min-height: 55vh;
      background:
        radial-gradient(
          ellipse at 50% 45%,
          rgba(101, 43, 61, .13),
          transparent 70%
        ),
        var(--bg);
    }

    /* ALT BİLGİ */

    footer {
      padding: 30px 20px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    footer .footer-brand {
      margin: 0 0 8px;
      color: var(--silver);
      font-family: "Great Vibes", cursive;
      font-size: 30px;
    }

    footer p {
      margin: 5px 0;
      color: var(--muted);
      font-size: 15px;
    }

    /* AÇILIR MENÜ */

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, .55);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s, visibility .25s;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: fixed;
      z-index: 10001;
      top: 0;
      right: 0;
      width: min(360px, 88vw);
      height: 100%;
      padding: 28px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: var(--surface);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform .3s ease;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .drawer-title {
      margin: 0;
      color: var(--silver);
      font-family: "Great Vibes", cursive;
      font-size: 35px;
    }

    .close-button {
      width: 40px;
      height: 40px;
      color: var(--text);
      background: transparent;
      border: 0;
      font-size: 28px;
      cursor: pointer;
    }

    .drawer-links {
      display: flex;
      flex-direction: column;
      padding-top: 18px;
    }

    .drawer-links a {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      font-size: 21px;
      transition: color .2s;
    }

    .drawer-links a:hover {
      color: var(--accent);
    }

    .drawer-bottom {
      margin-top: auto;
      padding-top: 30px;
    }

    .theme-label {
      display: block;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 2px;
    }

    .theme-controls {
      display: flex;
      gap: 10px;
    }

    .theme-option {
      flex: 1;
      padding: 12px 7px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 16px;
    }

    .theme-option.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--bg);
    }

    body.menu-open {
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .topbar {
        min-height: 52px;
        padding: 0 18px;
      }

      .brand {
        min-height: 250px;
        padding: 38px 12px;
      }

      .nav-inner {
        justify-content: flex-start;
        gap: 27px;
        padding: 16px 10px;
      }

      .main-nav a {
        font-size: 16px;
      }

      .home-space {
        min-height: 45vh;
      }

      #intro-screen {
        padding: 14px;
      }

      #skip-intro {
        right: 18px;
        bottom: 18px;
      }

      .drawer {
        padding: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- AÇILIŞ VİDEOSU -->
  <div id="intro-screen" aria-label="Site açılış videosu">
    <video
      id="intro-video"
      autoplay
      muted
      playsinline
      preload="auto"
      aria-label="kesmislalih açılış videosu"
    >
      <source src="intro.mp4" type="video/mp4">
    </video>

    <button id="skip-intro" type="button">
      Siteye geç →
    </button>
  </div>

  <!-- ÜST KISIM -->
  <header class="topbar">
    <button
      class="menu-button"
      id="menu-open"
      type="button"
      aria-label="Menüyü aç"
      aria-expanded="false"
      aria-controls="drawer"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- LOGO -->
  <section class="brand" aria-label="kesmislalih">
    <h1 class="logo">kesmislalih</h1>

    <p class="brand-name">𝙠𝙚𝙨𝙢𝙞𝙨𝙡𝙖𝙡𝙞𝙝</p>

    <p class="tagline">
      some stories are not meant to be told, but felt.
    </p>
  </section>

  <!-- YATAY MENÜ -->
  <nav class="main-nav" aria-label="Ana menü">
    <div class="nav-inner">
      <a href="index.html">Ana Sayfa</a>
      <a href="kitaplar.html">Kitaplar</a>
      <a href="karakterler.html">Karakterler</a>
      <a href="galeri.html">Galeri</a>
    </div>
  </nav>

  <!-- ŞİMDİLİK BOŞ ANA SAYFA ALANI -->
  <main>
    <section class="home-space" aria-label="Ana sayfa içerik alanı"></section>
  </main>

  <!-- ALT BİLGİ -->
  <footer>
    <p class="footer-brand">kesmislalih</p>
    <p>some stories are not meant to be told, but felt.</p>
    <p>© <span id="year"></span> kesmislalih</p>
  </footer>

  <!-- MENÜ KARARTMASI -->
  <div class="menu-overlay" id="menu-overlay"></div>

  <!-- SAĞ MENÜ -->
  <aside
    class="drawer"
    id="drawer"
    role="dialog"
    aria-modal="true"
    aria-label="Site menüsü"
    aria-hidden="true"
    inert
  >
    <div class="drawer-header">
      <h2 class="drawer-title">kesmislalih</h2>

      <button
        class="close-button"
        id="menu-close"
        type="button"
        aria-label="Menüyü kapat"
      >
        ×
      </button>
    </div>

    <nav class="drawer-links" aria-label="Diğer sayfalar">
      <a href="duvar.html">Duvar</a>
      <a href="duyurular.html">Duyurular</a>
      <a href="iletisim.html">İletişim</a>
    </nav>

    <div class="drawer-bottom">
      <span class="theme-label">GÖRÜNÜM</span>

      <div class="theme-controls">
        <button
          class="theme-option"
          id="light-mode"
          type="button"
          aria-pressed="false"
        >
          ☼ Aydınlık
        </button>

        <button
          class="theme-option"
          id="dark-mode"
          type="button"
          aria-pressed="false"
        >
          ☾ Karanlık
        </button>
      </div>
    </div>
  </aside>

  <script>
    // AÇILIŞ VİDEOSU
    const introScreen = document.getElementById("intro-screen");
    const introVideo = document.getElementById("intro-video");
    const skipIntro = document.getElementById("skip-intro");

    let introClosed = false;

    function closeIntro() {
      if (introClosed) return;

      introClosed = true;
      introScreen.classList.add("hide");
      introVideo.pause();
    }

    skipIntro.addEventListener("click", closeIntro);
    introVideo.addEventListener("ended", closeIntro);

    introVideo.play().catch(() => {
      // Otomatik oynatma engellenirse
      // ziyaretçi Siteye geç düğmesini kullanabilir.
    });

    // TEMA
    const body = document.body;
    const lightMode = document.getElementById("light-mode");
    const darkMode = document.getElementById("dark-mode");

    function applyTheme(theme) {
      const light = theme === "light";

      body.classList.toggle("light", light);

      lightMode.classList.toggle("active", light);
      darkMode.classList.toggle("active", !light);

      lightMode.setAttribute("aria-pressed", String(light));
      darkMode.setAttribute("aria-pressed", String(!light));

      document.querySelector('meta[name="theme-color"]')
        .setAttribute("content", light ? "#f5f1f0" : "#0b090a");

      try {
        localStorage.setItem("siteTheme", theme);
      } catch (error) {
        // Tema, depolama kullanılamasa da değişir.
      }
    }

    let savedTheme = "dark";

    try {
      savedTheme = localStorage.getItem("siteTheme") || "dark";
    } catch (error) {
      // Varsayılan koyu tema kullanılır.
    }

    applyTheme(savedTheme);

    lightMode.addEventListener("click", () => applyTheme("light"));
    darkMode.addEventListener("click", () => applyTheme("dark"));

    // SAĞ MENÜ
    const drawer = document.getElementById("drawer");
    const menuOverlay = document.getElementById("menu-overlay");
    const menuOpen = document.getElementById("menu-open");
    const menuClose = document.getElementById("menu-close");

    function openMenu() {
      drawer.classList.add("open");
      menuOverlay.classList.add("open");
      body.classList.add("menu-open");

      drawer.removeAttribute("inert");
      drawer.setAttribute("aria-hidden", "false");
      menuOpen.setAttribute("aria-expanded", "true");

      menuClose.focus();
    }

    function closeMenu() {
      drawer.classList.remove("open");
      menuOverlay.classList.remove("open");
      body.classList.remove("menu-open");

      drawer.setAttribute("inert", "");
      drawer.setAttribute("aria-hidden", "true");
      menuOpen.setAttribute("aria-expanded", "false");

      menuOpen.focus();
    }

    menuOpen.addEventListener("click", openMenu);
    menuClose.addEventListener("click", closeMenu);
    menuOverlay.addEventListener("click", closeMenu);

    document.addEventListener("keydown", (event) => {
      if (
        event.key === "Escape" &&
        drawer.classList.contains("open")
      ) {
        closeMenu();
      }
    });

    // YIL
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
