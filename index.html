<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>kesmislalih</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap');


/* =========================
   TEMEL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    --bg: #09090b;
    --surface: #111015;
    --surface-2: #17141a;

    --text: #eee9e2;
    --soft: #aaa39a;
    --muted: #756d76;

    --border: #29252d;

    --accent: #cdb9eb;

    min-height: 100vh;

    background: var(--bg);

    color: var(--text);

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    transition:
        background .35s ease,
        color .35s ease;
}


/* =========================
   AYDINLIK MOD
========================= */

body.light {

    --bg: #f6f2ed;
    --surface: #eee8e1;
    --surface-2: #e7dfd7;

    --text: #18151a;
    --soft: #3f3936;
    --muted: #625b57;

    --border: #c9c0b7;

    --accent: #80659e;
}


/* =========================
   GENEL
========================= */

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: inherit;
}


/* =========================
   HEADER
========================= */

header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 78px;

    padding: 0 6%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    z-index: 1000;

    background:
        rgba(9, 9, 11, .90);

    backdrop-filter:
        blur(15px);

    border-bottom:
        1px solid var(--border);

    transition:
        background .35s ease;
}

body.light header {

    background:
        rgba(246, 242, 237, .94);
}


/* =========================
   LOGO
========================= */

.logo {

    display: flex;

    align-items: center;
}

.logo-image {

    width: 140px;

    height: auto;

    display: block;
}


/* =========================
   NAV
========================= */

nav {

    display: flex;

    align-items: center;

    gap: 25px;
}

nav a {

    position: relative;

    color: var(--soft);

    font-family:
        Arial,
        sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    transition: .3s ease;
}

nav a:hover {

    color: var(--accent);
}

nav a::after {

    content: "";

    position: absolute;

    left: 0;
    bottom: -7px;

    width: 0;
    height: 1px;

    background: var(--accent);

    transition: .3s ease;
}

nav a:hover::after {

    width: 100%;
}


/* =========================
   HESAP BUTONLARI
========================= */

.account-link {

    color: var(--text);

    border:
        1px solid var(--accent);

    padding:
        9px 14px;

    font-family:
        Arial,
        sans-serif;

    font-size: 7px;

    letter-spacing: 2px;

    transition:
        .3s ease;
}

.account-link:hover {

    background:
        var(--accent);

    color:
        var(--bg);
}

.profile-link {

    display: none;
}

body.logged-in .profile-link {

    display: inline-block;
}

body.logged-in .login-link,
body.logged-in .register-link {

    display: none;
}


/* =========================
   TEMA BUTONU
========================= */

.theme-button {

    width: 38px;
    height: 38px;

    min-width: 38px;
    min-height: 38px;

    padding: 0;

    border:
        1px solid var(--border);

    background:
        var(--surface);

    color:
        var(--text);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    cursor:
        pointer;

    font-size:
        17px;

    border-radius:
        0;

    transform:
        none !important;

    transition:
        background .3s ease,
        color .3s ease,
        border-color .3s ease;
}

.theme-button:hover {

    color:
        var(--accent);

    transform:
        none !important;
}

.theme-button:active {

    transform:
        none !important;

    border-radius:
        0;
}


/* =========================
   3 ÇİZGİLİ MENÜ
========================= */

.menu-button {

    display: none;

    width: 38px;
    height: 38px;

    padding: 0;

    border:
        1px solid var(--border);

    background:
        var(--surface);

    cursor:
        pointer;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    gap:
        5px;

    z-index:
        1101;
}

.menu-button span {

    width: 17px;
    height: 1px;

    background:
        var(--text);

    transition:
        .3s ease;
}

.menu-button.active span:nth-child(1) {

    transform:
        translateY(6px)
        rotate(45deg);
}

.menu-button.active span:nth-child(2) {

    opacity: 0;
}

.menu-button.active span:nth-child(3) {

    transform:
        translateY(-6px)
        rotate(-45deg);
}


/* =========================
   HERO
========================= */

.hero {

    min-height: 100vh;

    padding:
        130px 6% 90px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    position:
        relative;

    text-align:
        center;

    overflow:
        hidden;
}

.hero::before {

    content: "";

    position:
        absolute;

    width:
        650px;

    height:
        650px;

    border-radius:
        50%;

    background:
        radial-gradient(
            circle,
            rgba(173,142,214,.12),
            transparent 68%
        );

    top:
        50%;

    left:
        50%;

    transform:
        translate(-50%, -50%);
}

.hero-content {

    position:
        relative;

    z-index:
        2;

    width:
        100%;

    max-width:
        850px;
}


/* =========================
   HERO ÜST YAZI
========================= */

.hero-small {

    margin-bottom:
        24px;

    color:
        var(--muted);

    font-family:
        Arial,
        sans-serif;

    font-size:
        8px;

    letter-spacing:
        5px;
}


/* =========================
   ANA LOGO
========================= */

.hero-logo {

    display:
        block;

    width:
        min(430px, 78vw);

    height:
        auto;

    margin:
        0 auto;
}


/* =========================
   ALT YAZI
========================= */

.hero-subtitle {

    margin-top:
        25px;

    color:
        var(--soft);

    font-size:
        17px;

    letter-spacing:
        2px;

    line-height:
        1.8;
}


/* =========================
   AÇIKLAMA
========================= */

.hero-description {

    max-width:
        560px;

    margin:
        20px auto 0;

    color:
        var(--soft);

    font-size:
        18px;

    line-height:
        1.75;
}


/* =========================
   HERO BUTON
========================= */

.hero-button {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        14px;

    margin-top:
        30px;

    padding:
        14px 26px;

    border:
        1px solid var(--accent);

    color:
        var(--text);

    font-family:
        Arial,
        sans-serif;

    font-size:
        8px;

    letter-spacing:
        3px;

    transition:
        .3s ease;
}

.hero-button:hover {

    background:
        var(--accent);

    color:
        var(--bg);
}


/* =========================
   SCROLL
========================= */

.scroll-indicator {

    position:
        absolute;

    bottom:
        28px;

    left:
        50%;

    transform:
        translateX(-50%);

    color:
        var(--muted);

    font-family:
        Arial,
        sans-serif;

    font-size:
        7px;

    letter-spacing:
        4px;
}


/* =========================
   GENEL BÖLÜMLER
========================= */

.section {

    width:
        min(1100px, 88%);

    margin:
        0 auto;

    padding:
        100px 0;
}


/* =========================
   AYIRICI
========================= */

.divider {

    width:
        45px;

    height:
        1px;

    margin:
        0 auto;

    background:
        var(--accent);
}


/* =========================
   HAKKIMDA
========================= */

.about {

    text-align:
        center;
}

.about-inner {

    max-width:
        680px;

    margin:
        0 auto;
}

.section-title {

    color:
        var(--text);

    font-family:
        Arial,
        sans-serif;

    font-size:
        16px;

    font-weight:
        400;

    letter-spacing:
        5px;

    margin-bottom:
        28px;
}

.about-text {

    color:
        var(--soft);

    font-size:
        20px;

    line-height:
        1.8;
}

.signature {

    margin-top:
        25px;

    color:
        var(--accent);

    font-family:
        "Great Vibes",
        cursive;

    font-size:
        30px;
}


/* =========================
   BÖLÜM BAŞLIKLARI
========================= */

.section-heading {

    text-align:
        center;

    margin-bottom:
        55px;
}

.section-heading h2 {

    color:
        var(--text);

    font-size:
        38px;

    font-weight:
        400;

    letter-spacing:
        3px;
}

.section-heading p {

    margin-top:
        10px;

    color:
        var(--muted);

    font-family:
        Arial,
        sans-serif;

    font-size:
        8px;

    letter-spacing:
        4px;

    text-transform:
        uppercase;
}


/* =========================
   KİTAPLAR
========================= */

.bookshelf {

    width:
        100%;

    overflow:
        hidden;

    padding:
        10px 0 35px;

    position:
        relative;
}

.books-grid {

    display:
        flex;

    align-items:
        flex-end;

    gap:
        38px;

    overflow-x:
        auto;

    overflow-y:
        hidden;

    padding:
        15px 20px 25px;

    scroll-snap-type:
        x mandatory;

    scrollbar-width:
        thin;

    scrollbar-color:
        var(--accent)
        var(--surface);
}

.books-grid::-webkit-scrollbar {

    height:
        5px;
}

.books-grid::-webkit-scrollbar-track {

    background:
        var(--surface);
}

.books-grid::-webkit-scrollbar-thumb {

    background:
        var(--accent);
}


/* =========================
   KİTAP KARTI
========================= */

.book-card {

    flex:
        0 0 235px;

    scroll-snap-align:
        center;

    position:
        relative;

    transition:
        transform .35s ease;
}

.book-card:hover {

    transform:
        translateY(-8px);
}


/* =========================
   KİTAP KAPAĞI
========================= */

.book-cover {

    width:
        235px;

    aspect-ratio:
        2 / 3;

    overflow:
        hidden;

    background:
        var(--surface-2);

    border:
        1px solid var(--border);

    box-shadow:
        8px 5px 0
        rgba(0,0,0,.18),

        15px 10px 25px
        rgba(0,0,0,.30);

    position:
        relative;
}

.book-cover img {

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    display:
        block;

    transition:
        transform .45s ease;
}

.book-card:hover
.book-cover img {

    transform:
        scale(1.025);
}


/* =========================
   KİTAP BİLGİLERİ
========================= */

.book-info {

    padding:
        18px 4px 5px;

    text-align:
        center;
}

.book-info h3 {

    color:
        var(--text);

    font-size:
        26px;

    font-weight:
        400;

    line-height:
        1.2;
}

.book-author {

    margin-top:
        3px;

    color:
        var(--accent);

    font-family:
        "Great Vibes",
        cursive;

    font-size:
        23px;
}

.book-description {

    margin:
        15px auto 0;

    color:
        var(--soft);

    font-size:
        15px;

    line-height:
        1.7;
}

        </p>

    </div>

        <div

            <h3>
                Aramıza katıl
            </h3>


            <p>
                Yorumlarını kullanıcı adınla paylaşmak
                ve kendi profilini oluşturmak için
                giriş yap veya kayıt ol.
            </p>


            <div class="profile-buttons">

                <a
                    href="giris.html"
                    class="profile-button">

                    GİRİŞ YAP

                </a>


                <a
                    href="kayit.html"
                    class="profile-button profile-button-filled">

                    KAYIT OL

                </a>

            </div>

        </div>


        <div
            id="loggedInProfile"
            style="display: none;">

            <div class="profile-welcome">

                Hoş geldin,
                <span id="profileUsername"></span>

            </div>

document.addEventListener(
