<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>kesmislalih</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap');


/* =========================
   TEMEL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    --bg: #09090b;
    --surface: #111015;
    --surface-2: #17141a;

    --text: #eee9e2;
    --soft: #aaa39a;
    --muted: #756d76;

    --border: #29252d;

    --accent: #cdb9eb;

    min-height: 100vh;

    background: var(--bg);

    color: var(--text);

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    transition:
        background .35s ease,
        color .35s ease;
}


/* =========================
   AYDINLIK MOD
========================= */

body.light {

    --bg: #f6f2ed;
    --surface: #eee8e1;
    --surface-2: #e7dfd7;

    --text: #18151a;
    --soft: #3f3936;
    --muted: #625b57;

    --border: #c9c0b7;

    --accent: #80659e;
}


/* =========================
   GENEL
========================= */

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: inherit;
}


/* =========================
   HEADER
========================= */

header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 78px;

    padding: 0 6%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    z-index: 1000;

    background:
        rgba(9, 9, 11, .90);

    backdrop-filter:
        blur(15px);

    border-bottom:
        1px solid var(--border);

    transition:
        background .35s ease;
}

body.light header {

    background:
        rgba(246, 242, 237, .94);
}


/* =========================
   LOGO
========================= */

.logo {

    display: flex;

    align-items: center;
}

.logo-image {

    width: 140px;

    height: auto;

    display: block;
}


/* =========================
   MENÜ BUTONU
   TÜM CİHAZLARDA
========================= */

.menu-button {

    display: flex;

    width: 42px;
    height: 42px;

    padding: 0;

    border:
        1px solid var(--border);

    background:
        var(--surface);

    color:
        var(--text);

    cursor:
        pointer;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    gap:
        5px;

    z-index:
        1101;

    transition:
        .3s ease;
}

.menu-button:hover {

    border-color:
        var(--accent);
}

.menu-button span {

    width: 18px;
    height: 1px;

    background:
        var(--text);

    transition:
        .3s ease;
}

.menu-button.active span:nth-child(1) {

    transform:
        translateY(6px)
        rotate(45deg);
}

.menu-button.active span:nth-child(2) {

    opacity: 0;
}

.menu-button.active span:nth-child(3) {

    transform:
        translateY(-6px)
        rotate(-45deg);
}


/* =========================
   ANA MENÜ
========================= */

nav {

    position: fixed;

    top: 92px;
    right: 6%;

    width: 245px;

    padding: 20px;

    display: flex;

    flex-direction: column;

    align-items: stretch;

    gap: 0;

    background:
        var(--surface);

    border:
        1px solid var(--border);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.35);

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(-10px);

    transition:
        opacity .3s ease,
        visibility .3s ease,
        transform .3s ease;

    z-index:
        1100;
}

nav.active {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0);
}

nav a {

    position: relative;

    display: block;

    padding: 15px 5px;

    border-bottom:
        1px solid var(--border);

    color: var(--soft);

    font-family:
        Arial,
        sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    transition: .3s ease;
}

nav a:hover {

    color:
        var(--accent);
}

nav a::after {

    content: "";

    position:
        absolute;

    left: 0;
    bottom: 7px;

    width: 0;
    height: 1px;

    background:
        var(--accent);

    transition:
        .3s ease;
}

nav a:hover::after {

    width: 100%;
}


/* =========================
   TEMA BUTONU
========================= */

.theme-button {

    width: 38px;
    height: 38px;

    min-width: 38px;
    min-height: 38px;

    margin:
        18px auto 0;

    padding: 0;

    border:
        1px solid var(--border);

    background:
        var(--surface-2);

    color:
        var(--text);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    cursor:
        pointer;

    font-size:
        17px;

    border-radius:
        0;

    transform:
        none !important;

    transition:
        background .3s ease,
        color .3s ease,
        border-color .3s ease;
}

.theme-button:hover {

    color:
        var(--accent);

    border-color:
        var(--accent);

    transform:
        none !important;
}

.theme-button:active {

    transform:
        none !important;

    border-radius:
        0;
}


/* =========================
   HERO
========================= */

.hero {

    min-height: 100vh;

    padding:
        130px 6% 90px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    position:
        relative;

    text-align:
        center;

    overflow:
        hidden;
}

.hero::before {

    content: "";

    position:
        absolute;

    width:
        650px;

    height:
        650px;

    border-radius:
        50%;

    background:
        radial-gradient(
            circle,
            rgba(173,142,214,.12),
            transparent 68%
        );

    top:
        50%;

    left:
        50%;

    transform:
        translate(-50%, -50%);
}

.hero-content {

    position:
        relative;

    z-index:
        2;

    width:
        100%;

    max-width:
        850px;
}


/* =========================
   HERO ÜST YAZI
========================= */

.hero-small {

    margin-bottom:
        24px;

    color:
        var(--muted);

    font-family:
        Arial,
        sans-serif;

    font-size:
        8px;

    letter-spacing:
        5px;
}


/* =========================
   ANA LOGO
========================= */

.hero-logo {

    display:
        block;

    width:
        min(430px, 78vw);

    height:
        auto;

    margin:
        0 auto;
}


/* =========================
   ALT YAZI
========================= */

.hero-subtitle {

    margin-top:
        25px;

    color:
        var(--soft);

    font-size:
        17px;

    letter-spacing:
        2px;

    line-height:
        1.8;
}


/* =========================
   AÇIKLAMA
========================= */

.hero-description {

    max-width:
        560px;

    margin:
        20px auto 0;

    color:
        var(--soft);

    font-size:
        18px;

    line-height:
        1.75;
}


/* =========================
   HERO BUTON
========================= */

.hero-button {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        14px;

    margin-top:
        30px;

    padding:
        14px 26px;

    border:
        1px solid var(--accent);

    color:
        var(--text);

    font-family:
        Arial,
        sans-serif;

    font-size:
        8px;

    letter-spacing:
        3px;

    transition:
        .3s ease;
}

.hero-button:hover {

    background:
        var(--accent);

    color:
        var(--bg);
}


/* =========================
   SCROLL
========================= */

.scroll-indicator {

    position:
        absolute;

    bottom:
        28px;

    left:
        50%;

    transform:
        translateX(-50%);

    color:
        var(--muted);

    font-family:
        Arial,
        sans-serif;

    font-size:
        7px;

    letter-spacing:
        4px;
}


/* =========================
   GENEL BÖLÜMLER
========================= */

.section {

    width:
        min(1100px, 88%);

    margin:
        0 auto;

    padding:
        100px 0;
}


/* =========================
   AYIRICI
========================= */

.divider {

    width:
        45px;

    height:
        1px;

    margin:
        0 auto;

    background:
        var(--accent);
}


/* =========================
   HAKKIMDA
========================= */

.about {

    text-align:
        center;
}

.about-inner {

    max-width:
        680px;

    margin:
        0 auto;
}

.section-title {

    color:
        var(--text);

    font-family:
        Arial,
        sans-serif;

    font-size:
        16px;

    font-weight:
        400;

    letter-spacing:
        5px;

    margin-bottom:
        28px;
}

.about-text {

    color:
        var(--soft);

    font-size:
        20px;

    line-height:
        1.8;
}

.signature {

    margin-top:
        25px;

    color:
        var(--accent);

    font-family:
        "Great Vibes",
        cursive;

    font-size:
        30px;
}


/* =========================
   BÖLÜM BAŞLIKLARI
========================= */

.section-heading {

    text-align:
        center;

    margin-bottom:
        55px;
}

.section-heading h2 {

    color:
        var(--text);

    font-size:
        38px;

    font-weight:
        400;

    letter-spacing:
        3px;
}

.section-heading p {

    margin-top:
        10px;

    color:
        var(--muted);

    font-family:
        Arial,
        sans-serif;

    font-size:
        8px;

    letter-spacing:
        4px;

    text-transform:
        uppercase;
}


/* =========================
   KİTAPLAR
========================= */

.bookshelf {

    width:
        100%;

    overflow:
        hidden;

    padding:
        10px 0 35px;

    position:
        relative;
}

.books-grid {

    display:
        flex;

    align-items:
        flex-end;

    gap:
        38px;

    overflow-x:
        auto;

    overflow-y:
        hidden;

    padding:
        15px 20px 25px;

    scroll-snap-type:
        x mandatory;

    scrollbar-width:
        thin;

    scrollbar-color:
        var(--accent)
        var(--surface);
}

.books-grid::-webkit-scrollbar {

    height:
        5px;
}

.books-grid::-webkit-scrollbar-track {

    background:
        var(--surface);
}

.books-grid::-webkit-scrollbar-thumb {

    background:
        var(--accent);
}


/* =========================
   KİTAP KARTI
========================= */

.book-card {

    flex:
        0 0 235px;

    scroll-snap-align:
        center;

    position:
        relative;

    transition:
        transform .35s ease;
}

.book-card:hover {

    transform:
        translateY(-8px);
}


/* =========================
   KİTAP KAPAĞI
========================= */

.book-cover {

    width:
        235px;

    aspect-ratio:
        2 / 3;

    overflow:
        hidden;

    background:
        var(--surface-2);

    border:
        1px solid var(--border);

    box-shadow:
        8px 5px 0
        rgba(0,0,0,.18),

        15px 10px 25px
        rgba(0,0,0,.30);

    position:
        relative;
}

.book-cover img {

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    display:
        block;

    transition:
        transform .45s ease;
}

.book-card:hover
.book-cover img {

    transform:
        scale(1.025);
}


/* =========================
   KİTAP BİLGİLERİ
========================= */

.book-info {

    padding:
        18px 4px 5px;

    text-align:
        center;
}

.book-info h3 {

    color:
        var(--text);

    font-size:
        26px;

    font-weight:
        400;

    line-height:
        1.2;
}

.book-author {

    margin-top:
        3px;

    color:
        var(--accent);

    font-family:
        "Great Vibes",
        cursive;

    font-size:
        23px;
}

.book-description {

    margin:
        15px auto 0;

    color:
        var(--soft);

    font-size:
        15px;

    line-height:
        1.7;
}


/* =========================
   KİTAP BUTONU
========================= */

.book-button {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        12px;

    margin-top:
        20px;

    padding:
        12px 21px;

    border:
        1px solid var(--accent);

    color:
        var(--text);

    font-family:
        Arial,
        sans-serif;

    font-size:
        8px;

    letter-spacing:
        3px;

    transition:
        .3s ease;
}

.book-button:hover {

    background:
        var(--accent);

    color:
        var(--bg);
}

<script>


/* =========================
   TEMA
========================= */

const themeButton =
    document.getElementById("themeButton");


const themeIcon =
    document.getElementById("themeIcon");


const savedTheme =
    localStorage.getItem("kesmislalih-theme");


if (savedTheme === "light") {

    document.body.classList.add("light");

    themeIcon.textContent = "☀";

} else {

    themeIcon.textContent = "☾";

}


themeButton.addEventListener(
    "click",
    function() {


        document.body.classList.toggle("light");


        const isLight =
            document.body.classList.contains("light");


        if (isLight) {

            themeIcon.textContent = "☀";

            localStorage.setItem(
                "kesmislalih-theme",
                "light"
            );

        } else {

            themeIcon.textContent = "☾";

            localStorage.setItem(
                "kesmislalih-theme",
                "dark"
            );

        }

    }
);



/* =========================
   MENÜ
========================= */

const menuButton =
    document.getElementById("menuButton");


const mainNav =
    document.getElementById("mainNav");


menuButton.addEventListener(
    "click",
    function() {

        mainNav.classList.toggle("active");

        menuButton.classList.toggle("active");


        if (
            mainNav.classList.contains("active")
        ) {

            menuButton.setAttribute(
                "aria-label",
                "Menüyü kapat"
            );

        } else {

            menuButton.setAttribute(
                "aria-label",
                "Menüyü aç"
            );

        }

    }
);



/* =========================
   MENÜ LİNKLERİ
========================= */

const menuLinks =
    mainNav.querySelectorAll("a");


menuLinks.forEach(
    function(link) {

        link.addEventListener(
            "click",
            function() {

                mainNav.classList.remove(
                    "active"
                );

                menuButton.classList.remove(
                    "active"
                );

                menuButton.setAttribute(
                    "aria-label",
                    "Menüyü aç"
                );

            }
        );

    }
);



/* =========================
   DIŞARI TIKLAYINCA MENÜYÜ KAPAT
========================= */

document.addEventListener(
    "click",
    function(event) {

        if (
            !mainNav.contains(event.target) &&
            !menuButton.contains(event.target)
        ) {

            mainNav.classList.remove("active");

            menuButton.classList.remove("active");

            menuButton.setAttribute(
                "aria-label",
                "Menüyü aç"
            );

        }

    }
);



/* =========================
   YATAY KİTAP KAYDIRMA
========================= */

const booksGrid =
    document.querySelector(".books-grid");


if (booksGrid) {

    booksGrid.addEventListener(
        "wheel",
        function(event) {

            if (
                Math.abs(event.deltaY) >
                Math.abs(event.deltaX)
            ) {

                event.preventDefault();

                booksGrid.scrollLeft +=
                    event.deltaY;

            }

        },
        {
            passive: false
        }
    );

}
