
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<style>
:root {
  --bg: #0b080a;
  --text: #f5edf0;
  --muted: #c8b9c0;
  --accent: #9f2948;
  --line: rgba(210, 170, 185, .18);
  --panel: rgba(18, 10, 14, .96);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  background: var(--bg);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Cormorant Garamond", serif;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

body.light {
  --bg: #f4eef0;
  --text: #24151b;
  --muted: #6c555f;
  --accent: #8f2442;
  --line: rgba(75, 30, 48, .18);
  --panel: rgba(248, 240, 243, .97);
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
}

.no-scroll {
  overflow: hidden;
}

/* AÇILIŞ VİDEOSU */

#intro-screen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #080608;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .8s ease, visibility .8s ease;
}

#intro-screen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#intro-video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #080608;
}

#skip-intro {
  position: absolute;
  right: 22px;
  bottom: 22px;
  padding: 9px 17px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 30px;
  background: rgba(10, 5, 8, .65);
  color: #fff;
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

/* ÜST MENÜ */

.topbar {
  position: absolute;
  z-index: 20;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 76px;
  padding: 18px 5.5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  background: linear-gradient(
    to bottom,
    rgba(7, 5, 7, .88),
    rgba(7, 5, 7, .25),
    transparent
  );
}

.brand-small {
  font-family: "Great Vibes", cursive;
  font-size: 35px;
  color: #f2dfe5;
  white-space: nowrap;
  text-shadow: 0 2px 16px rgba(0,0,0,.65);
}

.main-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 3vw, 36px);
}

.main-nav a {
  font-size: 16px;
  letter-spacing: 1.3px;
  color: #f5edf0;
  position: relative;
  transition: color .25s;
  white-space: nowrap;
  text-shadow: 0 2px 8px #000;
}

.main-nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -6px;
  width: 0;
  height: 1px;
  background: #d58ba1;
  transition: width .25s;
}

.main-nav a:hover {
  color: #e5a4b8;
}

.main-nav a:hover::after {
  width: 100%;
}

#menu-button {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  gap: 5px;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 50%;
  background: rgba(12, 7, 10, .45);
  cursor: pointer;
}

#menu-button span {
  display: block;
  width: 15px;
  height: 1px;
  background: #fff;
}

/* ANA SAHNE */

.hero {
  position: relative;
  width: 100%;
  min-height: 100svh;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  isolation: isolate;
  overflow: hidden;
  background: #090609;
}

.hero-video-wrap {
  position: absolute;
  inset: 0;
  z-index: -3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #090609;
}

#hero-video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #090609;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(
      180deg,
      rgba(8, 5, 8, .30) 0%,
      rgba(8, 5, 8, .12) 32%,
      rgba(8, 5, 8, .48) 72%,
      rgba(8, 5, 8, .92) 100%
    ),
    radial-gradient(
      ellipse at center,
      rgba(10, 5, 8, .04) 0%,
      rgba(10, 5, 8, .22) 70%,
      rgba(10, 5, 8, .5) 100%
    );
  pointer-events: none;
}

.hero-content {
  width: min(92%, 760px);
  margin: 0 auto;
  padding: 110px 0 65px;
  text-align: center;
  position: relative;
  z-index: 2;
  animation: fadeIn 1.4s ease both;
}

.signature {
  font-family: "Great Vibes", cursive;
  font-size: clamp(68px, 12vw, 126px);
  line-height: 1.15;
  font-weight: 400;
  color: #fff6f8;
  text-shadow:
    0 2px 3px rgba(0,0,0,.95),
    0 5px 24px rgba(0,0,0,.9),
    0 0 38px rgba(120, 22, 54, .38);
  letter-spacing: 1px;
}

.signature-sub {
  margin-top: 5px;
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(17px, 3vw, 25px);
  font-weight: 500;
  letter-spacing: clamp(3px, 1vw, 7px);
  color: #f8e9ee;
  text-shadow:
    0 2px 8px #000,
    0 0 20px rgba(0,0,0,.95);
}

.tagline {
  margin: 23px auto 0;
  max-width: 550px;
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(16px, 2.3vw, 21px);
  font-style: italic;
  letter-spacing: 1.1px;
  line-height: 1.6;
  color: #fff4f6;
  text-shadow:
    0 2px 5px #000,
    0 0 15px rgba(0,0,0,.95);
}

/* YUVARLAK SOSYAL AMBLEMLER */

.social-links {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 13px;
  margin-top: 27px;
}

.social-icon {
  width: 43px;
  height: 43px;
  border: 1px solid rgba(255, 224, 233, .72);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(13, 6, 10, .62);
  color: #fff5f7;
  box-shadow: 0 3px 16px rgba(0,0,0,.25);
  backdrop-filter: blur(7px);
  transition:
    transform .25s,
    background .25s,
    border-color .25s,
    box-shadow .25s;
}

.social-icon:hover {
  transform: translateY(-4px);
  background: #7e1938;
  border-color: #e8b3c3;
  box-shadow: 0 6px 22px rgba(120, 22, 54, .4);
}

.social-icon svg {
  width: 19px;
  height: 19px;
  display: block;
}

.social-icon .letter {
  font-family: Arial, sans-serif;
  font-weight: 600;
  font-size: 19px;
}

.social-icon .spotify-mark {
  font-size: 23px;
  line-height: 1;
  font-weight: 700;
}

.scroll-hint {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 240, 245, .7);
  font-size: 11px;
  letter-spacing: 4px;
  white-space: nowrap;
}

footer {

  text-align: center;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 1px;
  border-top: 1px solid var(--line);
}

/* YAN MENÜ */

#drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(0,0,0,.62);
  opacity: 0;
  visibility: hidden;
  transition: .3s;
}

#drawer-backdrop.open {
  opacity: 1;
  visibility: visible;
}

#drawer {
  position: fixed;
  z-index: 100;
  top: 0;
  right: 0;
  width: min(330px, 86vw);
  height: 100vh;
  height: 100dvh;
  padding: 26px;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-left: 1px solid var(--line);
  transform: translateX(105%);
  transition: transform .35s ease;
}

#drawer.open {
  transform: translateX(0);
}

.drawer-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 38px;
}

.drawer-logo {
  font-family: "Great Vibes", cursive;
  font-size: 36px;
  color: var(--accent);
}

#close-drawer {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  color: var(--text);
  background: transparent;
  font-size: 23px;
  cursor: pointer;
}

.drawer-links {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.drawer-links a {
  padding: 16px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 19px;
  letter-spacing: 1px;
  transition: color .2s;
}

.drawer-links a:hover {
  color: var(--accent);
}

.theme-controls {
  margin-top: auto;
  padding-top: 25px;
  border-top: 1px solid var(--line);
}

.theme-label {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 2px;
  margin-bottom: 13px;
}

.theme-buttons {
  display: flex;
  gap: 10px;
}

.theme-buttons button {
  flex: 1;
  padding: 11px 8px;
  border: 1px solid var(--line);
  border-radius: 25px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: .2s;
}

.theme-buttons button.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* HAREKET */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* TELEFON */

@media (max-width: 680px) {
  .topbar {
    min-height: 66px;
    padding: 12px 5%;
    gap: 12px;
  }

  .brand-small {
    font-size: 30px;
  }

  .main-nav {
    gap: 12px;
  }

  .main-nav a {
    font-size: 13px;
    letter-spacing: .3px;
  }

  .main-nav a:nth-child(3) {
    display: none;
  }

  #menu-button {

    height: 37px;
  }

  .hero-content {
    width: 94%;
    padding-top: 90px;
    padding-bottom: 55px;
  }

  .signature {
    font-size: clamp(62px, 15vw, 94px);
  }

  .signature-sub {
    font-size: clamp(14px, 3.5vw, 19px);
    letter-spacing: 3px;
  }

  .tagline {
    max-width: 330px;
    font-size: 16px;
    margin-top: 19px;
  }

  .social-links {
    gap: 11px;
    margin-top: 23px;
  }

  .social-icon {
    width: 39px;
    height: 39px;
  }

  .social-icon svg {
    width: 17px;
    height: 17px;
  }

  .scroll-hint {
    bottom: 13px;
    font-size: 9px;
    letter-spacing: 3px;
  }
}

@media (max-width: 390px) {
  .main-nav {
    gap: 9px;
  }

  .main-nav a {
    font-size: 12px;
  }

  .brand-small {
    font-size: 27px;
  }

  .social-links {
    gap: 9px;
  }

  .social-icon {
    width: 36px;
    height: 36px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

<script>
  
/* =========================
   AÇILIŞ VİDEOSU
========================= */

const introScreen = document.getElementById("intro-screen");
const introVideo = document.getElementById("intro-video");
const skipIntro = document.getElementById("skip-intro");

function closeIntro() {
  if (!introScreen || introScreen.classList.contains("hidden")) return;

  introScreen.classList.add("hidden");
  document.body.classList.remove("no-scroll");

  if (introVideo) {
    introVideo.pause();
  }
}

document.body.classList.add("no-scroll");

skipIntro.addEventListener("click", closeIntro);

introVideo.addEventListener("ended", closeIntro);
introVideo.addEventListener("error", closeIntro);

introVideo.play().catch(() => {
  /* Otomatik oynatma engellenirse GEÇ düğmesi kullanılabilir. */
});


/* =========================
   ANA SAYFA VİDEOSU
========================= */

const heroVideo = document.getElementById("hero-video");

if (heroVideo) {
  heroVideo.play().catch(() => {
    /* Tarayıcı otomatik oynatmayı engelleyebilir. */
  });
}


/* =========================
   YAN MENÜ
========================= */

const menuButton = document.getElementById("menu-button");
const closeDrawerButton = document.getElementById("close-drawer");
const drawer = document.getElementById("drawer");
const drawerBackdrop = document.getElementById("drawer-backdrop");

function openDrawer() {
  drawer.classList.add("open");
  drawerBackdrop.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  menuButton.setAttribute("aria-expanded", "true");
  document.body.classList.add("no-scroll");
}

function closeDrawer() {
  drawer.classList.remove("open");
  drawerBackdrop.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
  menuButton.setAttribute("aria-expanded", "false");

  if (introScreen.classList.contains("hidden")) {
    document.body.classList.remove("no-scroll");
  }
}

menuButton.addEventListener("click", openDrawer);
closeDrawerButton.addEventListener("click", closeDrawer);
drawerBackdrop.addEventListener("click", closeDrawer);

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    closeDrawer();
    closeIntro();
  }
});


/* =========================
   AYDINLIK / KARANLIK TEMA
========================= */

const lightThemeButton = document.getElementById("light-theme");
const darkThemeButton = document.getElementById("dark-theme");

function applyTheme(theme) {
  const isLight = theme === "light";

  document.body.classList.toggle("light", isLight);

  lightThemeButton.classList.toggle("active", isLight);
  darkThemeButton.classList.toggle("active", !isLight);

  document.documentElement.style.colorScheme =
    isLight ? "light" : "dark";

  try {
    localStorage.setItem("siteTheme", theme);
  } catch (error) {
    /* Depolama kapalı olsa da tema değişir. */
  }
}

let savedTheme = "dark";

try {
  savedTheme = localStorage.getItem("siteTheme") || "dark";
} catch (error) {
  savedTheme = "dark";
}

applyTheme(savedTheme);

  applyTheme("light");
});

darkThemeButton.addEventListener("click", () => {
  applyTheme("dark");
});
