<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kesmislalih</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#080808;--panel:#111;--card:#151515;--text:#f2eeee;
  --muted:#999;--accent:#300000;--line:#292929;--shadow:#30000055;
}
body.light{
  --bg:#f4f1ef;--panel:#fff;--card:#fff;--text:#211d1d;
  --muted:#777;--accent:#650d18;--line:#ded7d7;--shadow:#650d1820;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Cormorant Garamond',serif;transition:.25s;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.container{width:min(100% - 28px,760px);margin:auto}
.top-actions{position:absolute;right:16px;top:15px;display:flex;gap:10px;z-index:5}
.icon-btn{
  width:34px;height:34px;border:1px solid var(--line);
  border-radius:50%;background:var(--panel);color:var(--text);
}
.profile{
  min-height:245px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:35px 15px 18px;
}
.profile-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32}
.profile::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,var(--bg))}
.profile-content{position:relative;z-index:1}
.avatar{
  width:86px;height:86px;border-radius:50%;object-fit:cover;
  border:2px solid var(--accent);margin:0 auto 8px;
}
.profile h1{font-size:clamp(25px,6vw,36px);font-weight:500;letter-spacing:3px;margin:0}
.tagline{font-size:15px;font-style:italic;color:var(--muted);margin:0 0 12px}
.socials{display:flex;justify-content:center;gap:14px;margin:10px 0}
.socials a{font-family:Arial,sans-serif;font-size:19px;opacity:.8}
.tabs{
  display:flex;justify-content:center;gap:0;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:4;
}
.tab{
  border:0;background:none;color:var(--muted);padding:14px 12px 11px;
  font-size:12px;font-family:Arial,sans-serif;font-weight:600;
  border-bottom:2px solid transparent;
}
.tab.active{color:var(--text);border-color:var(--accent)}
main{padding:14px 0 35px}
.panel{display:none}
.panel.active{display:block}
.section-title{font-size:22px;font-weight:500;margin:0 0 12px}
.books-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.book-card{min-width:0;text-align:center}
.book-cover{
  width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px;
  border:1px solid var(--line);box-shadow:0 5px 18px var(--shadow);
}
.book-name{font-size:16px;margin:7px 0 0}
.book-author{font:10px Arial,sans-serif;letter-spacing:2px;color:var(--muted);margin-top:3px}
  .post-list{display:grid;gap:12px}
.post{
  background:var(--card);border:1px solid var(--line);
  border-radius:5px;padding:13px;
}
.post-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.post-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover}
.post-author{font-size:15px}
.post-date{font:10px Arial,sans-serif;color:var(--muted)}
.post-text{font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.post-actions{display:flex;gap:14px;margin-top:10px;font:11px Arial,sans-serif;color:var(--muted)}
.write-btn,.submit-btn,.back-btn{
  background:var(--accent);color:#fff;border:0;border-radius:3px;
  padding:10px 15px;font:12px Arial,sans-serif;letter-spacing:.5px;
}
.write-form{display:none;margin:12px 0}
.write-form.open{display:block}
.write-form input,.write-form textarea,.comment-input{
  width:100%;padding:11px;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:3px;margin-bottom:8px;
}
.write-form textarea{min-height:110px;resize:vertical}
.character-books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.character-book{background:none;border:0;color:var(--text);text-align:center}
.character-book img{width:100%;aspect-ratio:2/3;object-fit:cover;border:1px solid var(--line);box-shadow:0 5px 18px var(--shadow)}
.character-list{display:none}
.character-list.open{display:block}
.character-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.character-card{background:var(--card);border:1px solid var(--line);padding:8px;text-align:center;color:var(--text)}
.character-card img{width:100%;aspect-ratio:3/4;object-fit:cover}
.character-card h3{font-size:17px;font-weight:500;margin:8px 0 3px}
.character-detail{display:none;margin-top:14px;padding:12px;background:var(--card);border:1px solid var(--line)}
.character-detail.open{display:block}
.character-detail img{width:min(100%,260px);margin:0 auto 12px}
.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gallery-grid img{width:100%;aspect-ratio:1;object-fit:cover}
.comment-area{display:none;margin-top:10px}
.comment-area.open{display:block}
.comment{font-size:14px;border-top:1px solid var(--line);padding:7px 0}
@media(min-width:600px){
  .books-grid,.character-books{grid-template-columns:repeat(3,minmax(0,1fr))}
  .character-grid,.gallery-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .profile{min-height:280px}
}
</style>
</head>
<body>
  <header>
  <div class="top-actions">
    <button class="icon-btn" id="menuBtn" aria-label="Menü">☰</button>
    <button class="icon-btn" id="themeBtn" aria-label="Tema değiştir">☼</button>
  </div>

  <section class="profile">
    <video class="profile-bg" autoplay muted loop playsinline>
      <source src="bloggg_erss_pindown.io_1793296543.mp4" type="video/mp4">
    </video>
    <div class="profile-content">
      <img class="avatar" src="d08eae9afcf72d4a213a3d988ecf5935.jpg" alt="kesmislalih">
      <h1>KESMİSLALİH</h1>
      <p class="tagline">some stories are not meant to be told, but felt.</p>
      <div class="socials">
        <a href="https://www.tiktok.com/@kesmislalih_" aria-label="TikTok">♪</a>
        <a href="https://x.com/kesmislalih" aria-label="X">𝕏</a>
        <a href="https://pin.it/2jHDXi48B" aria-label="Pinterest">℘</a>
        <a href="https://whatsapp.com/channel/0029VbD65x1KmCPN91PUU11e" aria-label="WhatsApp">◉</a>
      </div>
    </div>
  </section>

  <nav class="tabs">
    <button class="tab active" data-tab="books">KİTAPLAR</button>
    <button class="tab" data-tab="wall">PANO</button>
    <button class="tab" data-tab="characters">KARAKTERLER</button>
    <button class="tab" data-tab="gallery">GALERİ</button>
  </nav>
</header>

<main class="container">
  <section class="panel active" id="books">
    <div class="books-grid">
      <a class="book-card" href="ringteki-son-dans.html">
        <img class="book-cover" src="file_00000000375c81f4b311415188148be7.png" alt="Ringteki Son Dans">
        <div class="book-name">Ringteki Son Dans</div>
        <div class="book-author">KESMİSLALİH</div>
      </a>
    </div>
  </section>

  <section class="panel" id="wall">
    <button class="write-btn" id="writeBtn">YAZMA</button>
    <form class="write-form" id="writeForm">
      <input id="postName" maxlength="40" placeholder="Adın veya kullanıcı adın" required>
      <textarea id="postText" maxlength="1500" placeholder="Pano'ya bir şeyler yaz..." required></textarea>
      <button class="submit-btn" type="submit">PAYLAŞ</button>
    </form>
    <div class="post-list" id="postList"></div>
  </section>

  <section class="panel" id="characters">
    <div id="characterBooks" class="character-books"></div>
    <div id="characterList" class="character-list">
      <button class="back-btn" id="backToBooks">← KİTAPLAR</button>
      <h2 class="section-title" id="characterBookTitle"></h2>
      <div class="character-grid" id="characterGrid"></div>
      <div class="character-detail" id="characterDetail"></div>
    </div>
  </section>

  <section class="panel" id="gallery">
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>
</main>
<script>
const books = [
  {
    id:"ring",
    title:"Ringteki Son Dans",
    cover:"file_00000000375c81f4b311415188148be7.png",
    characters:[
      {name:"Lavinia",image:"a90393fd3d48a69ffbec30ef8ba04749 (1).jpg",bio:""},
      {name:"Arel",image:"41723ea72a5db4f82fe52815d61e341a.jpg",bio:""},
      {name:"Defne Yalçın",image:"066f212a61b08c53d9eb10ef7647a0f3.jpg",bio:""},
      {name:"Efe Yalçın",image:"0b873940e46b8abc779347119a1998e0.jpg",bio:""},
      {name:"Seren Yalçın",image:"5ea49c0b074bc3d33b1516a381a7e689.jpg",bio:""},
      {name:"Cihangir Yalçın",image:"723a5f267d9ced55d8babbb5f9539a07.jpg",bio:""}
    ]
  }
];

const galleryImages = [
"520b988f63b52ae66a0127a457e5e7d0.jpg",
"45041afda2229d508a38cc012aaa7174.jpg",
"0f8b7991dde0f22ff23fb81e0fc16649.jpg",
"0668f965d8247c1756f1be2f3ee5e1be.jpg",
"025e7f39ec9bd3227fa182d2f735d65c.jpg",
"6b0bac9092b0bc230917f062c52e84ad.jpg",
"9be113dce8dd12d87ae4f2bf8cf5293e (1).jpg",
"bd00784591329cdde6e7804525bb3951.jpg"
];

const characterBooks = document.getElementById("characterBooks");
const characterList = document.getElementById("characterList");
const characterGrid = document.getElementById("characterGrid");
const characterDetail = document.getElementById("characterDetail");

books.forEach(book=>{
  const button=document.createElement("button");
  button.className="character-book";
  button.innerHTML=`<img src="${book.cover}" alt="${book.title}"><div class="book-name">${book.title}</div>`;
  button.addEventListener("click",()=>showBookCharacters(book));
  characterBooks.appendChild(button);
});

function showBookCharacters(book){
  characterBooks.style.display="none";
  characterList.classList.add("open");
  document.getElementById("characterBookTitle").textContent=book.title;
  characterGrid.innerHTML="";
  characterDetail.classList.remove("open");

  book.characters.forEach(character=>{
    const card=document.createElement("button");
    card.className="character-card";
    card.innerHTML=`<img src="${character.image}" alt="${character.name}"><h3>${character.name}</h3>`;
    card.addEventListener("click",()=>{
      characterDetail.innerHTML=`
        <img src="${character.image}" alt="${character.name}">
        <h2 class="section-title">${character.name}</h2>
        <p>${character.bio || "Karakter bilgileri yakında."}</p>`;
      characterDetail.classList.add("open");
    });
    characterGrid.appendChild(card);
  });
}

document.getElementById("backToBooks").addEventListener("click",()=>{
  characterList.classList.remove("open");
  characterBooks.style.display="grid";
});

galleryImages.forEach(src=>{
  const img=document.createElement("img");
  img.src=src;img.alt="Galeri görseli";img.loading="lazy";
  document.getElementById("galleryGrid").appendChild(img);
});
  document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab).classList.add("active");
  });
});

const themeBtn=document.getElementById("themeBtn");
if(localStorage.getItem("siteTheme")==="light") document.body.classList.add("light");

themeBtn.addEventListener("click",()=>{
  document.body.classList.toggle("light");
  localStorage.setItem("siteTheme",document.body.classList.contains("light")?"light":"dark");
});

document.getElementById("writeBtn").addEventListener("click",()=>{
  document.getElementById("writeForm").classList.toggle("open");
});

const SUPABASE_URL="SUPABASE_PROJE_URLİNİ_BURAYA_YAZ";
const SUPABASE_ANON_KEY="SUPABASE_ANON_KEYİNİ_BURAYA_YAZ";
let supabaseClient=null;

if(SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("BURAYA")){
  supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
}

const postList=document.getElementById("postList");
let localPosts=JSON.parse(localStorage.getItem("wallPosts")||"[]");

function renderPosts(posts){
  postList.innerHTML="";
  posts.forEach(post=>{
    const article=document.createElement("article");
    article.className="post";
    article.innerHTML=`
      <div class="post-head">
        <img class="post-avatar" src="d08eae9afcf72d4a213a3d988ecf5935.jpg" alt="">
        <div><div class="post-author"></div><div class="post-date"></div></div>
      </div>
      <div class="post-text"></div>
      <div class="post-actions"><button class="comment-toggle">Yorumlar</button></div>
      <div class="comment-area"><div class="comments"></div>
        <input class="comment-input" placeholder="Yorum yaz...">
        <button class="submit-btn comment-submit">Gönder</button>
      </div>`;
    article.querySelector(".post-author").textContent=post.name;
    article.querySelector(".post-date").textContent=post.date;
    article.querySelector(".post-text").textContent=post.text;
    article.querySelector(".comment-toggle").addEventListener("click",()=>{
      article.querySelector(".comment-area").classList.toggle("open");
    });
    article.querySelector(".comment-submit").addEventListener("click",()=>{
      const input=article.querySelector(".comment-input");
      if(!input.value.trim())return;
      const comment=document.createElement("div");
      comment.className="comment";
      comment.textContent=input.value.trim();
      article.querySelector(".comments").appendChild(comment);
      input.value="";
    });
    postList.appendChild(article);
  });
}

async function loadPosts(){
  if(supabaseClient){
    const {data,error}=await supabaseClient.from("wall_posts").select("*").order("created_at",{ascending:false});
    if(!error && data){renderPosts(data.map(p=>({name:p.name,text:p.text,date:new Date(p.created_at).toLocaleDateString("tr-TR")})));return;}
  }
  renderPosts(localPosts);
}

document.getElementById("writeForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=document.getElementById("postName").value.trim();
  const text=document.getElementById("postText").value.trim();
  if(!name||!text)return;
  const post={name,text,date:new Date().toLocaleDateString("tr-TR")};

  if(supabaseClient){
    const {error}=await supabaseClient.from("wall_posts").insert({name,text});
    if(error){alert("Paylaşım gönderilemedi. Supabase ayarlarını kontrol et.");return;}
    await loadPosts();
  }else{
    localPosts.unshift(post);
    localStorage.setItem("wallPosts",JSON.stringify(localPosts));
    renderPosts(localPosts);
  }
  e.target.reset();
  e.target.classList.remove("open");
});

loadPosts();
</script>
</body>
</html>
