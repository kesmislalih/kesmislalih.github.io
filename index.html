/* =========================
   GENEL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {
    background: #09090b;
    color: #f3efe8;
    font-family: "Cormorant Garamond", serif;
}


/* =========================
   HEADER
========================= */

header {

    width: 100%;

    padding: 25px 6%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    position: absolute;

    top: 0;
    left: 0;

    z-index: 100;

}


.logo {

    color: #f8f3ff;

    text-decoration: none;

    font-family: "Great Vibes", cursive;

    font-size: 32px;

    text-shadow:
        0 0 6px rgba(220,195,255,.45),
        0 0 16px rgba(185,167,216,.25);

}


/* =========================
   MENÜ BUTONU
========================= */

.menu-button {

    width: 40px;
    height: 40px;

    border: 1px solid #38323f;

    background: rgba(9,9,11,.75);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 5px;

    cursor: pointer;

    z-index: 102;

}


.menu-line {

    width: 18px;
    height: 1px;

    background: #eee8e1;

    transition: .3s;

}


.menu-button.active
.menu-line:nth-child(1) {

    transform:
        translateY(6px)
        rotate(45deg);

}


.menu-button.active
.menu-line:nth-child(2) {

    opacity: 0;

}


.menu-button.active
.menu-line:nth-child(3) {

    transform:
        translateY(-6px)
        rotate(-45deg);

}


/* =========================
   MENÜ PANELİ
========================= */

.menu-panel {

    position: fixed;

    top: 0;

    right: -330px;

    width: 310px;

    height: 100vh;

    background: #111015;

    border-left: 1px solid #302a38;

    padding: 120px 40px 40px;

    z-index: 101;

    transition: right .45s ease;

    overflow-y: auto;

}


.menu-panel.open {

    right: 0;

}


.menu-small-title {

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 4px;

    color: #756d79;

    margin-bottom: 30px;

}


.menu-panel a {

    display: block;

    padding: 18px 0;

    border-bottom: 1px solid #29252d;

    color: #e8e2da;

    text-decoration: none;

    font-size: 22px;

    transition: .3s;

}


.menu-panel a:hover {

    color: #cdb9eb;

    padding-left: 8px;

}


.menu-footer {

    margin-top: 45px;

    font-family: "Great Vibes", cursive;

    font-size: 26px;

    color: #8f819e;

}


/* =========================
   MENÜ ARKA PLAN
========================= */

.menu-overlay {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.45);

    backdrop-filter: blur(2px);

    opacity: 0;

    visibility: hidden;

    transition: .3s;

    z-index: 100;

}


.menu-overlay.open {

    opacity: 1;

    visibility: visible;

}


/* =========================
   SOSYAL MEDYA
========================= */

.menu-social-title {

    margin-top: 45px;

    margin-bottom: 18px;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 3px;

    color: #756d79;

}


.menu-social {

    display: flex;

    gap: 15px;

    align-items: center;

}


.menu-social a {

    border: none;

    padding: 0;

    display: flex;

    align-items: center;

    justify-content: center;

}


.menu-social a:hover {

    padding-left: 0;

}


.icon {

    width: 20px;

    height: 20px;

    fill: #aaa39a;

    transition: .3s;

}


.menu-social a:hover .icon {

    fill: #cdb9eb;

}


.wattpad-icon {

    font-family: Arial, sans-serif;

    font-weight: bold;

    font-size: 20px;

    color: #aaa39a;

}


.menu-social a:hover
.wattpad-icon {

    color: #cdb9eb;

}


/* =========================
   BURAYA DEVAM EDECEĞİZ
========================= */
